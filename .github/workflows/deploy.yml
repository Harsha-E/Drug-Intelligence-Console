name: Deploy Clinical Intelligence Command Center

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Tests
        run: |
          PYTHONPATH=. python tests/regression_suite.py
          PYTHONPATH=. pytest backend/test_main.py

      - name: Build Docker Image
        run: docker build -t dic-command-center:latest .
