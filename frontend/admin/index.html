<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Intelligence Observatory</title>
    <!-- Structural & Data Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">
    <div class="observatory-layout">
        
        <!-- Global Nav -->
        <nav class="global-nav">
            <div class="nav-brand">DIC Observatory</div>
            <div class="nav-links">
                <a href="#/">Live Runtime</a>
                <a href="#/analyze">Analyze</a>
            </div>
            <div id="connection-status" class="status-indicator disconnected">OFFLINE</div>
        </nav>

        <!-- Main Workspace -->
        <main class="workspace">
            <div id="main-viewport" class="viewport">
                <!-- Router dynamically mounts views here -->
            </div>
            
            <!-- Universal Inspector (TEAM D) -->
            <aside id="devtools-panel" class="inspector-panel" style="display: none;">
                <div class="inspector-header">
                    <h3>Execution Inspector</h3>
                    <button onclick="window.app && window.app.layoutManager ? window.app.layoutManager.togglePanel('devtools-panel') : null">×</button>
                </div>
                <div id="inspector-content" class="inspector-content">
                    <!-- TEAM D mounts here -->
                </div>
            </aside>
        </main>
        
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
